[databases]
demo_pgbouncer = host=host.docker.internal port=5432 user=postgres password=postgres dbname=demo_pgbouncer

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 50
default_pool_size = 20
reserve_pool_size = 10
reserve_pool_timeout = 5
application_name_add_host = 1

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
